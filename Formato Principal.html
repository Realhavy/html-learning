	<!-- Formato principal -->
 
<!DOCTYPE html>
<html lang="es">
		<!-- lo que esta en el "head" no saldrá en la página -->
	<head>
			<!-- Esto sirve para decirle al navegador cómo debe interpretar los caracteres y símbolos de tu página -->
		<meta charset="UTF-8" />
			<!-- Para poner un titulo pero aparecera en el elemento de tab -->
		<title> Formato Principal </title>
	</head>
		<!-- "Body" es la parte principal de la página -->
	<body>
	
		<main>
			<!-- Este elemento define una división que contiene el contenido principal del documento --> 
		</main>
		
		<header>
			<!-- Este elemento define la cabecera del cuerpo -->
		</header>
		
		<nav>
			<!-- Este elemento define una division que contiene ayuda para la navegación -->
		</nav>
		
		<section>
			<!-- Este elemento define una seccion genérica -->
		</section>
		
		<aside>
			<!-- Este elemento se utiliza nnormalmente para poner el enlace de anuncios en los laterales de la página -->
			<!-- Tambien podemos poner algo relacionado con la tema principal -->
		</aside>
		
		<article>
			<!-- Este elemento representa un articulo independiente -->
		</article>
		
		<footer>
			<!-- Este elemento define el pie del cuerpo o de secciones dentro del cuerpo -->
		</footer>
		
		<div> <!-- Este elemento define una división genérica --> 
			<!-- tambien se usa cuando no se puede aplicar ningún otro elemento -->
		</div>
		
	</body>
</html>
